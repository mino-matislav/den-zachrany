name: Kniha PDF

# Zostaví knihu Deň Záchrany (PDF pergamen + PDF na tlač) vždy, keď sa zmenia dáta webu,
# a nahrá ju ako prílohy vydania "kniha". Odkazy na stiahnutie sa nemenia:
#   https://github.com/mino-matislav/den-zachrany/releases/download/kniha/Den-Zachrany-kniha.pdf
#   https://github.com/mino-matislav/den-zachrany/releases/download/kniha/Den-Zachrany-kniha-tlac.pdf
# Workflow necommituje do repozitára (nespúšťa nasadenie na Vercel).

on:
  push:
    branches: [main]
    paths:
      - "js/data.js"
      - "js/data-songs.js"
      - "index.html"
      - "tools/kniha/**"
      - ".github/workflows/kniha.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kniha-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Systémové knižnice pre WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Python balíky
        run: pip install -r tools/kniha/requirements.txt

      - name: Dáta, písma a grafika
        working-directory: tools/kniha
        run: |
          node export_data.js
          python setup_fonts.py
          python gfx.py
          python icons.py

      - name: Zostavenie PDF
        working-directory: tools/kniha
        run: |
          python build_sk.py pergamen
          python build_sk.py tlac
          python check_pdf.py

      - name: Nahranie do vydania "kniha"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view kniha >/dev/null 2>&1 || gh release create kniha --title "Kniha Deň Záchrany (PDF)" --notes "Automaticky zostavená kniha podľa aktuálneho obsahu webu." --latest=false
          gh release upload kniha tools/kniha/out/Den-Zachrany-kniha.pdf tools/kniha/out/Den-Zachrany-kniha-tlac.pdf --clobber
          gh release edit kniha --notes "Automaticky zostavená kniha podľa aktuálneho obsahu webu. Posledná aktualizácia: $(date -u +'%d. %m. %Y %H:%M') UTC."
